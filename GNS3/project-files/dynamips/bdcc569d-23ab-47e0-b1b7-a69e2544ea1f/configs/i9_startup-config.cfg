!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname HR
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.0.20.1 10.0.20.10
ip dhcp excluded-address 10.10.10.1 10.10.10.20
!
ip dhcp pool HR-POOL
   network 10.0.20.0 255.255.255.128
   default-router 10.0.20.1 
   dns-server 8.8.8.8 
!
ip dhcp pool HR-LAN
   network 10.10.10.0 255.255.255.0
   default-router 10.10.10.2 
   dns-server 8.8.8.8 
   domain-name corp.local
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key HR_EXEC_KEY address 10.10.40.2
!
!
crypto ipsec transform-set TS-HR-EXEC esp-aes 256 esp-sha-hmac 
!
crypto map CM-HR-EXEC 10 ipsec-isakmp 
 set peer 10.10.40.2
 set transform-set TS-HR-EXEC 
 match address ACL-HR-EXEC
!
crypto map CMAP-HR-EXEC 10 ipsec-isakmp 
 set peer 10.0.255.1
 set peer 10.0.255.2
 set transform-set TS-HR-EXEC 
 set pfs group5
 match address CRYPTO-HR-EXEC
!
!
!
!
!
!
!
interface FastEthernet0/0
 description Secure link to EXEC CE
 ip address 10.10.40.1 255.255.255.252
 no ip redirects
 no ip proxy-arp
 speed 100
 full-duplex
 crypto map CM-HR-EXEC
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description HR LAN
 ip address 10.10.10.2 255.255.255.0
 ip access-group ACL-SQL-HR in
 speed 100
 full-duplex
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 ip address 10.10.11.2 255.255.255.252
 serial restart-delay 0
 clock rate 64000
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description To PE R1 (OSPF)
 speed 100
 crypto map CM-HR-EXEC
!
interface FastEthernet2/1
 description Link to LDS CE Fa2/0
!
interface FastEthernet2/2
!
interface FastEthernet2/3
!
interface FastEthernet2/4
!
interface FastEthernet2/5
!
interface FastEthernet2/6
!
interface FastEthernet2/7
!
interface FastEthernet2/8
!
interface FastEthernet2/9
!
interface FastEthernet2/10
!
interface FastEthernet2/11
!
interface FastEthernet2/12
!
interface FastEthernet2/13
!
interface FastEthernet2/14
!
interface FastEthernet2/15
!
interface Vlan1
 no ip address
!
router ospf 10
 router-id 10.10.10.254
 log-adjacency-changes
 passive-interface FastEthernet0/1
 network 10.10.10.2 0.0.0.0 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.11.2 0.0.0.0 area 0
 network 10.10.11.0 0.0.0.255 area 10
 network 10.255.10.0 0.0.0.3 area 10
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 172.20.100.1
ip route 0.0.0.0 0.0.0.0 172.20.100.5
ip route 10.0.10.0 255.255.255.192 10.0.255.1
ip route 10.10.10.0 255.255.255.0 10.0.255.1
ip route 10.20.10.0 255.255.255.0 10.10.40.2
ip route 10.20.30.0 255.255.255.0 10.10.11.1
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL-HR-EXEC
 permit ip 10.10.10.0 0.0.0.255 10.20.10.0 0.0.0.255
ip access-list extended ACL-SQL-HR
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.30.10 eq 1433
 permit icmp 10.10.10.0 0.0.0.255 host 10.20.30.10
 deny   ip any host 10.20.30.10
 permit ip any any
ip access-list extended CRYPTO-HR-EXEC
 permit ip any any
!
access-list 110 permit ip 10.10.10.0 0.0.0.255 10.20.10.0 0.0.0.255
arp 10.10.40.2 c208.21bc.0000 ARPA
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input telnet ssh
!
!
end
