!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname P
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.255.255.254 255.255.255.255
!
interface FastEthernet0/0
 description To MAN_HO PE (R1)
 ip address 172.20.20.1 255.255.255.252
 speed 100
 full-duplex
 mpls ip
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description To LDS PE
 ip address 172.20.20.5 255.255.255.252
 speed 100
 full-duplex
 mpls ip
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description To NCL PE
 ip address 172.20.20.9 255.255.255.252
 speed 100
 full-duplex
 mpls ip
!
router ospf 1
 router-id 10.255.255.254
 log-adjacency-changes
 passive-interface Loopback0
 network 10.0.0.10 0.0.0.0 area 0
 network 10.0.0.254 0.0.0.0 area 0
 network 10.255.255.254 0.0.0.0 area 0
 network 172.20.20.0 0.0.0.3 area 0
 network 172.20.20.4 0.0.0.3 area 0
 network 172.20.20.8 0.0.0.3 area 0
 network 172.20.20.0 0.0.0.15 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
mpls ldp router-id Loopback0 force
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line aux 0
line vty 0 4
 login
!
!
end
