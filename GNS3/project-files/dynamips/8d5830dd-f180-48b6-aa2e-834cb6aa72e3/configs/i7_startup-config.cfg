!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname MAN_HO
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
!
ip dhcp pool EXEC_POOL
   network 10.1.1.0 255.255.255.0
   default-router 10.1.1.1 
   lease 7
!
ip dhcp pool HR_POOL
   network 10.2.2.0 255.255.255.0
   default-router 10.2.2.1 
   lease 7
!
!
ip vrf EXEC_VPN
 description VPN for EXEC to R&D
 rd 65001:2
 route-target export 65001:2
 route-target import 65001:2
!
ip vrf HR_VPN
 description Full mesh VPN for HR, PRODUCTION 1, LOGISTICS
 rd 65001:1
 route-target export 65001:1
 route-target import 65001:1
!
ip vrf VPN-EXEC-RD
 rd 65000:20
 route-target export 65000:120
 route-target import 65000:120
!
ip vrf VPN-HRL
 rd 65000:10
 route-target export 65000:110
 route-target import 65000:110
!
ip vrf VPN-OTHER
 rd 65000:30
 route-target export 65000:130
 route-target import 65000:130
!
ip vrf VRF-EXEC-RND
 rd 65000:300
 route-target export 65000:300
 route-target import 65000:300
!
ip vrf VRF-OPS
 rd 65000:100
 route-target export 65000:100
 route-target import 65000:100
!
no ip domain lookup
!
mpls label protocol ldp
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 1
 encr aes 256
 authentication pre-share
 lifetime 28800
crypto isakmp key cisco123 address 10.2.2.1
!
!
crypto ipsec transform-set SECURE_TRANS esp-aes 256 esp-sha-hmac 
!
crypto map SECURE_MAP 10 ipsec-isakmp 
 set peer 10.2.2.1
 set transform-set SECURE_TRANS 
 match address 101
crypto map SECURE_MAP 20 ipsec-isakmp 
 set peer 10.5.5.1
 set transform-set SECURE_TRANS 
 match address 102
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 description BGP Update-Source / RD base
 ip address 1.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description To P (Core MPLS)
 ip address 172.20.20.2 255.255.255.252
 duplex auto
 speed auto
 mpls ip
!
interface FastEthernet0/0.10
 encapsulation dot1Q 10
 ip vrf forwarding VPN-HRL
 shutdown
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description To HR CE
 ip vrf forwarding VPN-HRL
 ip address 10.10.10.1 255.255.255.0
 speed 100
 full-duplex
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description To EXEC CE (VRF VPN-EXEC-RD)
 ip vrf forwarding VPN-EXEC-RD
 ip address 10.20.40.10 255.255.255.252
 speed 100
 full-duplex
 crypto map SECURE_MAP
!
router ospf 210 vrf VRF-OPS
 router-id 1.100.1.1
 log-adjacency-changes
 passive-interface default
 network 10.255.10.0 0.0.0.3 area 10
!
router ospf 310 vrf VRF-EXEC-RND
 log-adjacency-changes
 passive-interface default
 network 10.255.50.0 0.0.0.3 area 30
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface Loopback0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.0.1 0.0.0.0 area 0
 network 172.20.20.2 0.0.0.0 area 0
 network 172.20.20.0 0.0.0.3 area 0
 network 172.20.20.101 0.0.0.0 area 0
!
router ospf 330 vrf VRF-EXEC-RND
 log-adjacency-changes
 passive-interface default
 network 10.255.50.0 0.0.0.3 area 33
!
router ospf 100 vrf VPN-HRL
 router-id 100.100.100.1
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.40.4 0.0.0.3 area 0
!
router ospf 200 vrf VPN-EXEC-RD
 router-id 200.200.200.1
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet2/0
 network 10.20.40.8 0.0.0.3 area 0
!
router bgp 65000
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source Loopback0
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 update-source Loopback0
 !
 address-family vpnv4
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 send-community extended
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf VRF-OPS
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VRF-EXEC-RND
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-OTHER
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-HRL
  redistribute ospf 100 vrf VPN-HRL
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-EXEC-RD
  redistribute ospf 200 vrf VPN-EXEC-RD
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf HR_VPN
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf EXEC_VPN
  no synchronization
 exit-address-family
!
ip forward-protocol nd
ip route vrf VRF-EXEC-RND 10.20.10.0 255.255.255.0 10.20.200.2
!
!
no ip http server
no ip http secure-server
!
access-list 101 permit ip 10.1.1.0 0.0.0.255 10.2.2.0 0.0.0.255
access-list 102 permit ip 10.1.1.0 0.0.0.255 10.5.5.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
!
mpls ldp router-id Loopback0
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input ssh
!
!
end
