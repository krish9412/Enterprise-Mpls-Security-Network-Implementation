!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname EXEC
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.0.10.1 10.0.10.10
ip dhcp excluded-address 10.20.10.1 10.20.10.20
!
ip dhcp pool EXEC-POOL
   network 10.0.10.0 255.255.255.192
   default-router 10.0.10.1 
   dns-server 8.8.8.8 
!
ip dhcp pool EXEC-LAN
   network 10.20.10.0 255.255.255.0
   default-router 10.20.10.254 
   dns-server 8.8.8.8 
   domain-name company.local
   lease 7
!
!
ip vrf VPN-EXEC-RD
 rd 65000:3
 route-target export 65000:3
 route-target import 65000:3
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
!
crypto isakmp policy 20
 encr aes
 authentication pre-share
 group 5
 lifetime 28800
!
crypto isakmp policy 30
 encr aes
 authentication pre-share
 group 2
crypto isakmp key HR-EXEC-KEY address 10.0.255.2
crypto isakmp key EXEC-RND-LANA address 10.255.50.6
crypto isakmp key HR_EXEC_KEY address 10.10.40.1
crypto isakmp key EXEC_RND_KEY address 10.20.40.2
crypto isakmp key EXEC_RND_KEY address 10.10.50.2
!
!
crypto ipsec transform-set TS-HR-EXEC esp-aes 256 esp-sha-hmac 
crypto ipsec transform-set TS-EXEC-RND-A esp-aes esp-sha-hmac 
 mode transport
crypto ipsec transform-set TS-EXEC-RND esp-aes esp-sha-hmac 
!
crypto map CM-EXEC-RND 10 ipsec-isakmp 
 set peer 10.20.40.2
 set peer 10.10.50.2
 set transform-set TS-EXEC-RND 
 match address ACL-EXEC-RND
!
crypto map CM-HR-EXEC 10 ipsec-isakmp 
 set peer 10.10.40.1
 set peer 10.10.40.5
 set transform-set TS-HR-EXEC 
 match address ACL-EXEC-HR
!
crypto map CMAP-EXEC-RND 10 ipsec-isakmp 
 description Selective IPsec EXEC<->R&D LAN A
 set peer 10.255.50.6
 set transform-set TS-EXEC-RND-A 
 match address EXEC-RND-LANA-IPSEC
!
crypto map CMAP-HR-EXEC 10 ipsec-isakmp 
 set peer 10.0.255.2
 set transform-set TS-HR-EXEC 
 set pfs group5
 match address CRYPTO-HR-EXEC
!
!
!
!
!
!
!
interface FastEthernet0/0
 description Secure link to HR CE
 ip address 10.10.40.2 255.255.255.252
 no ip redirects
 no ip proxy-arp
 speed 100
 full-duplex
 crypto map CM-HR-EXEC
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description To EXEC LAN
 ip address 10.20.10.254 255.255.255.0
 speed 100
 full-duplex
!
interface Serial0/1
 no ip address
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 ip address 10.10.50.1 255.255.255.252
 serial restart-delay 0
 clock rate 64000
 crypto map CM-EXEC-RND
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description To PE R1 (OSPF)
 speed 100
 crypto map CM-HR-EXEC
!
interface FastEthernet2/1
 description IPSec link to NCL R&D
 crypto map CM-EXEC-RND
!
interface FastEthernet2/2
!
interface FastEthernet2/3
!
interface FastEthernet2/4
!
interface FastEthernet2/5
!
interface FastEthernet2/6
!
interface FastEthernet2/7
!
interface FastEthernet2/8
!
interface FastEthernet2/9
!
interface FastEthernet2/10
!
interface FastEthernet2/11
!
interface FastEthernet2/12
!
interface FastEthernet2/13
!
interface FastEthernet2/14
!
interface FastEthernet2/15
!
interface Vlan1
 no ip address
!
router ospf 30
 router-id 10.60.10.1
 log-adjacency-changes
 network 10.60.10.0 0.0.0.255 area 33
 network 10.255.50.0 0.0.0.3 area 33
!
router ospf 20
 router-id 10.20.10.254
 log-adjacency-changes
 network 10.20.10.254 0.0.0.0 area 0
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.11.2 0.0.0.0 area 0
 network 10.20.40.8 0.0.0.3 area 0
!
ip forward-protocol nd
ip route 10.0.20.0 255.255.255.128 10.0.255.2
ip route 10.10.10.0 255.255.255.0 10.10.40.1
ip route 10.10.11.0 255.255.255.0 10.0.255.2
ip route 10.30.10.0 255.255.255.0 10.10.50.2
ip route 10.30.11.0 255.255.255.0 10.10.50.2
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL-EXEC-HR
 remark permit EXEC-LAN to HR-LAN
 permit ip 10.20.10.0 0.0.0.255 10.10.10.0 0.0.0.255
ip access-list extended ACL-EXEC-RND
 permit ip 10.20.10.0 0.0.0.255 10.30.10.0 0.0.0.255
ip access-list extended ACL-HR-EXEC
 permit ip 10.10.10.0 0.0.0.255 10.20.10.0 0.0.0.255
ip access-list extended CRYPTO-HR-EXEC
 permit ip any any
 permit ip 10.0.10.0 0.0.0.255 10.10.11.0 0.0.0.255
 permit ip 10.10.11.0 0.0.0.255 10.0.10.0 0.0.0.255
ip access-list extended EXEC-RND-LANA-IPSEC
 remark Encrypt ONLY EXEC 10.60.10.0/24 <-> R&D LAN A 10.61.10.0/24
 permit ip 10.60.10.0 0.0.0.255 10.61.10.0 0.0.0.255
 permit ip 10.61.10.0 0.0.0.255 10.60.10.0 0.0.0.255
!
access-list 110 permit ip 10.20.10.0 0.0.0.255 10.10.10.0 0.0.0.255
access-list 120 permit ip 10.20.10.0 0.0.0.255 10.20.20.0 0.0.0.255
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input ssh
!
!
end
