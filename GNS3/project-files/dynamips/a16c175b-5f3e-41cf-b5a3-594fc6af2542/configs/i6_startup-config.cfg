!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname PRODUCTION-1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.0.30.1 10.0.30.10
ip dhcp excluded-address 10.10.20.1 10.10.20.20
!
ip dhcp pool PROD1-POOL
   network 10.0.30.0 255.255.255.128
   default-router 10.0.30.1 
   dns-server 8.8.8.8 
!
ip dhcp pool PROD1-LAN
   network 10.10.20.0 255.255.255.0
   default-router 10.10.20.254 
   dns-server 8.8.8.8 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface FastEthernet0/0
 description To PE LDS (VPN-HRL)
 ip address 10.10.20.2 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description PROD1 LAN
 ip address 10.20.10.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 10
 router-id 10.10.20.254
 log-adjacency-changes
 passive-interface FastEthernet0/1
 network 10.10.20.0 0.0.0.255 area 0
 network 10.20.10.0 0.0.0.255 area 10
 network 10.255.10.4 0.0.0.3 area 10
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 172.20.100.9
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line aux 0
line vty 0 4
 login
!
!
end
