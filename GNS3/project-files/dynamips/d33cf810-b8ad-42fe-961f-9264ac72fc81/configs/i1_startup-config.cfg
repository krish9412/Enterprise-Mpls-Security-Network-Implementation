!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname RND
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.20.20.1 10.20.20.20
ip dhcp excluded-address 10.20.30.1 10.20.30.10
!
ip dhcp pool RND-LAN-A
   network 10.20.20.0 255.255.255.0
   default-router 10.20.20.254 
   dns-server 8.8.8.8 
!
ip dhcp pool RND-LAN-B
   network 10.20.30.0 255.255.255.0
   default-router 10.20.30.254 
   dns-server 8.8.8.8 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 20
 encr aes
 authentication pre-share
 group 5
 lifetime 28800
!
crypto isakmp policy 30
 encr aes
 authentication pre-share
 group 2
crypto isakmp key EXEC-RND-LANA address 10.255.50.2
crypto isakmp key EXEC_RND_KEY address 10.20.10.2
!
!
crypto ipsec transform-set TS-EXEC-RND-A esp-aes esp-sha-hmac 
 mode transport
crypto ipsec transform-set TS-EXEC-RND esp-aes esp-sha-hmac 
!
crypto map CM-EXEC-RND 10 ipsec-isakmp 
 set peer 10.20.10.2
 set transform-set TS-EXEC-RND 
 match address 120
!
crypto map CMAP-EXEC-RND 10 ipsec-isakmp 
 set peer 10.255.50.2
 set transform-set TS-EXEC-RND-A 
 match address EXEC-RND-LANA-IPSEC
!
!
!
!
!
!
!
interface FastEthernet0/0
 description To PE NCL (P2P for VPN-EXEC-RD)
 ip address 10.20.40.2 255.255.255.252
 speed 100
 full-duplex
 crypto map CM-EXEC-RND
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description R&D LAN-A (Encrypted to EXEC)
 ip address 10.20.20.254 255.255.255.0
 speed 100
 full-duplex
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description R&D LAN-B (No IPSec)
 ip address 10.20.30.254 255.255.255.0
 speed 100
 full-duplex
 crypto map CMAP-EXEC-RND
!
router ospf 30
 router-id 10.61.10.1
 log-adjacency-changes
 passive-interface FastEthernet0/0
 passive-interface FastEthernet0/1
 network 10.61.10.0 0.0.0.255 area 33
 network 10.61.20.0 0.0.0.31 area 33
 network 10.255.50.4 0.0.0.3 area 33
!
router ospf 20
 router-id 10.20.20.254
 log-adjacency-changes
 passive-interface FastEthernet0/1
 passive-interface FastEthernet2/0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.20.30.0 0.0.0.255 area 0
 network 10.20.40.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list extended EXEC-RND-LANA-IPSEC
 permit ip 10.61.10.0 0.0.0.255 10.60.10.0 0.0.0.255
 permit ip 10.60.10.0 0.0.0.255 10.61.10.0 0.0.0.255
!
access-list 120 permit ip 10.20.20.0 0.0.0.255 10.20.10.0 0.0.0.255
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input ssh
!
!
end
