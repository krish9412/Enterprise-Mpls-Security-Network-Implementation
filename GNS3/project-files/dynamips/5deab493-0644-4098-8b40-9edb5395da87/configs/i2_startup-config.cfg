!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname LDS
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
!
ip dhcp pool PROD1_POOL
   network 10.3.3.0 255.255.255.0
   default-router 10.3.3.1 
   lease 7
!
!
ip vrf HR_VPN
 description Full mesh VPN for HR, PRODUCTION 1, LOGISTICS
 rd 65001:1
 route-target export 65001:1
 route-target import 65001:1
!
ip vrf VPN-EXEC-RD
 rd 65000:20
 route-target export 65000:120
 route-target import 65000:120
!
ip vrf VPN-HRL
 rd 65000:10
 route-target export 65000:110
 route-target import 65000:110
!
ip vrf VPN-OTHER
 rd 65000:30
 route-target export 65000:130
 route-target import 65000:130
!
ip vrf VRF-OPS
 rd 65000:100
 route-target export 65000:100
 route-target import 65000:100
!
no ip domain lookup
!
mpls label protocol ldp
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description To P (Core)
 ip address 172.20.20.6 255.255.255.252
 speed 100
 full-duplex
 mpls ip
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description To PROD1 CE (VPN-HRL)
 ip address 10.20.30.10 255.255.255.0 secondary
 ip address 10.20.30.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 description Link to HR
 ip address 10.10.11.1 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 210 vrf VRF-OPS
 router-id 1.100.2.1
 log-adjacency-changes
 passive-interface default
 network 10.255.10.4 0.0.0.3 area 10
!
router ospf 100 vrf VPN-HRL
 router-id 100.100.100.2
 log-adjacency-changes
 passive-interface default
 network 10.10.20.0 0.0.0.255 area 0
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 passive-interface Loopback0
 network 2.2.2.2 0.0.0.0 area 0
 network 10.0.0.2 0.0.0.0 area 0
 network 172.20.20.4 0.0.0.3 area 0
 network 172.20.20.102 0.0.0.0 area 0
!
router bgp 65000
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 update-source Loopback0
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf VRF-OPS
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-OTHER
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-HRL
  redistribute ospf 100 vrf VPN-HRL
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-EXEC-RD
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf HR_VPN
  no synchronization
 exit-address-family
!
ip forward-protocol nd
ip route 10.10.10.0 255.255.255.0 10.10.11.2
!
!
no ip http server
no ip http secure-server
!
access-list 101 permit tcp 10.2.2.0 0.0.0.255 10.3.3.0 0.0.0.255 eq 1433
access-list 101 deny   ip any 10.3.3.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
!
mpls ldp router-id Loopback0
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
