!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname NCL
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
!
ip dhcp pool LOG_POOL
   network 10.4.4.0 255.255.255.0
   default-router 10.4.4.1 
   lease 7
!
ip dhcp pool RND_A_POOL
   network 10.5.5.0 255.255.255.0
   default-router 10.5.5.1 
   lease 7
!
ip dhcp pool RND_B_POOL
   network 10.6.6.0 255.255.255.0
   default-router 10.6.6.1 
   lease 7
!
ip dhcp pool PROD2_POOL
   network 10.7.7.0 255.255.255.0
   default-router 10.7.7.1 
   lease 7
!
ip dhcp pool PROD2-LAN
   network 10.40.20.0 255.255.255.0
   default-router 10.40.20.1 
   dns-server 8.8.8.8 
   domain-name company.local
   lease 7
!
!
ip vrf EXEC_VPN
 description VPN for EXEC to R&D
 rd 65001:2
 route-target export 65001:2
 route-target import 65001:2
!
ip vrf HR_VPN
 description Full mesh VPN for HR, PRODUCTION 1, LOGISTICS
 rd 65001:1
 route-target export 65001:1
 route-target import 65001:1
!
ip vrf PROD2_VPN
 description Isolate PRODUCTION 2 from EXEC
 rd 65001:3
 route-target export 65001:3
 route-target import 65001:3
!
ip vrf VPN-EXEC-RD
 rd 65000:20
 route-target export 65000:120
 route-target import 65000:120
!
ip vrf VPN-HRL
 rd 65000:10
 route-target export 65000:110
 route-target import 65000:110
!
ip vrf VPN-OTHER
 rd 65000:30
 route-target export 65000:130
 route-target import 65000:130
!
ip vrf VPN-PROD2
!
ip vrf VRF-EXEC-RND
 rd 65000:300
 route-target export 65000:300
 route-target import 65000:300
!
ip vrf VRF-OPS
 rd 65000:100
 route-target export 65000:100
 route-target import 65000:100
!
no ip domain lookup
!
mpls label protocol ldp
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key EXEC_RND_KEY address 10.10.50.1
!
!
crypto ipsec transform-set TS-EXEC-RND esp-aes esp-sha-hmac 
!
crypto map CM-EXEC-RND 10 ipsec-isakmp 
 set peer 10.10.50.1
 set transform-set TS-EXEC-RND 
 match address ACL-RND-EXEC
!
crypto map SECURE_MAP 20 ipsec-isakmp 
 ! Incomplete
 set peer 10.1.1.1
 match address 102
!
!
vlan internal allocation policy ascending
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 description To P (Core)
 ip address 172.20.20.10 255.255.255.252
 duplex auto
 speed auto
 mpls ip
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 description R&D LAN A
 ip address 10.30.10.2 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/1
 description IPSec link to EXEC CE
 ip address 10.10.50.2 255.255.255.252
 clock rate 2000000
 crypto map CM-EXEC-RND
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 ip address 10.10.50.2 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 description CEb
 no switchport
 ip address 10.30.20.1 255.255.255.252
 duplex full
 speed 100
!
interface FastEthernet2/1
 description Link to PRODUCTION-2 CE (f0/0)
 ip vrf forwarding VPN-PROD2
 ip access-group ACL-BLOCK-PROD2-EXEC in
!
interface FastEthernet2/2
!
interface FastEthernet2/3
!
interface FastEthernet2/4
!
interface FastEthernet2/5
!
interface FastEthernet2/6
!
interface FastEthernet2/7
!
interface FastEthernet2/8
!
interface FastEthernet2/9
!
interface FastEthernet2/10
!
interface FastEthernet2/11
!
interface FastEthernet2/12
!
interface FastEthernet2/13
!
interface FastEthernet2/14
!
interface FastEthernet2/15
!
interface Vlan1
 no ip address
!
interface Vlan11
 description R&D LAN B SVI
 ip address 10.30.11.2 255.255.255.0
!
router ospf 210 vrf VRF-OPS
 router-id 1.100.3.1
 log-adjacency-changes
 passive-interface default
 network 10.255.10.8 0.0.0.3 area 10
!
router ospf 330 vrf VRF-EXEC-RND
 log-adjacency-changes
 passive-interface default
 network 10.255.50.4 0.0.0.3 area 33
!
router ospf 100 vrf VPN-HRL
 router-id 100.100.100.3
 log-adjacency-changes
 passive-interface default
 network 10.10.30.0 0.0.0.255 area 0
!
router ospf 200 vrf VPN-EXEC-RD
 router-id 200.200.200.3
 log-adjacency-changes
 passive-interface default
 network 10.20.40.0 0.0.0.3 area 0
!
router ospf 300 vrf VPN-OTHER
 log-adjacency-changes
 passive-interface default
 network 10.30.10.0 0.0.1.255 area 0
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 passive-interface Loopback0
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.0.3 0.0.0.0 area 0
 network 172.20.20.8 0.0.0.3 area 0
 network 172.20.20.103 0.0.0.0 area 0
!
router bgp 65000
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf VRF-OPS
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VRF-EXEC-RND
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-OTHER
  redistribute ospf 300 vrf VPN-OTHER
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-HRL
  redistribute ospf 100 vrf VPN-HRL
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf VPN-EXEC-RD
  redistribute ospf 200 vrf VPN-EXEC-RD
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf PROD2_VPN
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf HR_VPN
  no synchronization
 exit-address-family
 !
 address-family ipv4 vrf EXEC_VPN
  no synchronization
 exit-address-family
!
ip forward-protocol nd
ip route 10.20.10.0 255.255.255.0 10.10.50.1
ip route vrf VRF-EXEC-RND 10.20.20.0 255.255.255.0 10.20.200.6
ip route vrf VRF-EXEC-RND 10.20.30.0 255.255.255.0 10.20.200.6
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL-BLOCK-PROD2-EXEC
 deny   ip 10.40.20.0 0.0.0.255 10.20.10.0 0.0.0.255
 permit ip any any
ip access-list extended ACL-RND-EXEC
 permit ip 10.30.10.0 0.0.0.255 10.20.10.0 0.0.0.255
!
access-list 103 deny   ip 10.7.7.0 0.0.0.255 10.1.1.0 0.0.0.255
access-list 103 permit ip any any
no cdp log mismatch duplex
!
!
!
!
mpls ldp router-id Loopback0
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input ssh
!
!
end
